<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pinball Party</title>
<style>

  #msg small { display: block; margin-top: 8px; font-size: 18px; font-weight: 700; letter-spacing: 0; }

  .card h2 { margin: 0 0 4px; font-size: 27px; }
  .card h3 { margin: 14px 0 4px; font-size: 14px; color: #ffd166; text-align: left; }
  .card ol { text-align: left; margin: 0; padding-left: 26px; font-size: 14px; min-height: 22px; }
  .card li span { float: right; font-variant-numeric: tabular-nums; } .card li.me { color: #ffd166; font-weight: 700; }
  .card p { margin: 8px 0 0; font-size: 13px; opacity: .8; }
  button.go { width: 100%; min-height: 48px; margin-top: 14px; border: 0; border-radius: 12px; background: #ff5fa2; color: #2a0a1c; font: 800 17px system-ui, sans-serif; cursor: pointer; }
</style>

<body>
<canvas id="game"></canvas>
<div class="hud" id="top"></div>
<div class="hud" id="hint"></div>
<div class="hud" id="msg"></div>

<div id="over" hidden><div class="card">
  <h2 id="winner"></h2>
  <h3>This match</h3><ol id="ranking"></ol>
  <h3>Best match score</h3><ol id="board"><li>Loading…</li></ol>
  <button class="go" id="again">Play again</button><p id="next"></p>
</div></div>
<script>
/* ═══ PINBALL PARTY · a Multiplayer Agent starter ═════════════════════════════════════════
 * One shared pinball table seen from above. Every player guards a side (a gate) with two
 * flippers; a ball through your gate costs a life. Bumpers, boost lanes and corner targets
 * score points; light all four corners for an extra ball. Last gate standing wins.
 * Versus, 2–4 players (2: top and bottom; 3 or 4: more sides open); bots fill empty sides.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ lives, balls, speeds, flippers, bumpers, points, the bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   TABLE ......... the square table, turning a side's point of view (seat 0 = bottom), walls, lanes
 *   PHYSICS ....... balls against walls, bumpers, lanes and flippers (the host and everyone's prediction use it)
 *   MATCH (HOST) .. seats, lives, scores, new balls, drains, the winner, bot flippers. Only the host writes these.
 *   ME ............ my flippers; my own hits on the balls
 *   DRAW .......... the table turned so YOUR gate is at the bottom, flippers, balls, lights
 *   HUD & RESULTS . lives, messages, results card, leaderboard, sound
 *   INPUT ......... keys, mouse and touch (left half / right half)
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `fl` (which flippers are held: 1 left, 2 right) the
 *     moment it changes, `hb` (heartbeat) once a second, `rdy` (Play again), `n`/`c` once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s).
 *     Only the host writes the shared fields:
 *       `game` {id, v, phase, seats, lives, out, scores, lit, mb, win, startAt, nextBallAt,
 *              overAt}: who guards which side (a sessionId, "bot", or "" for a closed side),
 *              lives, points, which corner targets are lit. `v` goes up on every write.
 *       `balls` {b, p, s}: every ball [id, x, y, vx, vy, hits, launchAt, owner] ~15 times
 *              a second, p = the bots' flippers, s = write number.
 *   - The host moves the balls against the walls, bumpers, its own flippers and the bots'.
 *     Everyone else runs the balls on their own screen between writes, and YOUR flippers
 *     are decided on YOUR screen: when one hits a ball you see, it bounces at once and you
 *     send "hit" {k, x, y, vx, vy, g}; the host checks it is plausible and adopts it. A ball
 *     that drains through your gate on the host's screen waits `drainGrace` ms for your save.
 *   - Points go to whoever flipped a ball last. Someone who leaves is replaced by a bot (lives
 *     and points stay); someone who joins takes a bot's side. A new host adopts both fields.
 *   - ?attract plays offline, four bots and four balls (the preview video is recorded from it).
 *   - Leaderboard "pinball-score": each player's best match score.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 2,             // bots fill the table up to this many open sides (2–4); more people open more sides
  lives: 3,             // balls each gate can let through
  startBalls: 2,        // balls at the start of a match...
  maxBalls: 4,          // ...one more every extraBallMs (or for lighting all four corners), up to this many
  extraBallMs: 20000,
  table: 800,           // the square's side, in table units
  corner: 120,          // the angled corner walls (they're the targets)
  ballR: 12,
  launchSpeed: 360,     // a new ball's speed
  minSpeed: 260, maxSpeed: 1000, // balls never get slower or faster than this
  friction: 0.12,       // share of speed above minSpeed lost per second
  flipperL: 108, flipperR: 10, // flipper length and thickness
  flipperRest: 0.5, flipperUp: -0.45, // angles (radians, down is positive) at rest and fully up
  flipSpeed: 22,        // how fast a flipper swings (full swings per second)
  flipBounce: 0.55,     // how bouncy a flipper is (on top of its swing)
  bumperKick: 640,      // a bumper sends the ball off at least this fast
  laneBoost: 760,       // a boost lane sends the ball along it this fast
  points: { bumper: 10, lane: 25, corner: 50, drain: 100 }, // drain = bonus for the player who sent a ball through someone else's gate
  botMiss: 0.2,         // chance a bot doesn't flip at a ball coming its way
  botHoldMs: 220,       // how long a bot holds its flipper up
  countdownMs: 3000,    // before a match
  respawnMs: 900,       // a drained ball waits this long in the middle
  resultsMs: 9000,      // ms on the results card before the next match
  ballSendMs: 66,       // the balls (~15 a second)
  drainGrace: 200,      // ms someone else has to save a ball that drained on the host's screen
  board: "pinball-score",
};
const COLORS = ["#ff5fa2", "#36d6ff", "#ffd23f", "#5cff9d", "#b388ff", "#ff9b42", "#ff6bf0", "#3dffe0"];
const BOT_NAMES = ["Flippy", "Tilt", "Bumper", "Plunger"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'pinball-party',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
if (ATTRACT) Object.assign(CONFIG, { seats: 4, startBalls: 4, lives: 6, countdownMs: 300, respawnMs: 500, resultsMs: 1500, launchSpeed: 520, minSpeed: 380 });

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {

  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),

}
async function connect() {

    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);

  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A JSON field, parsed once per change (read-only: never mutate what this returns). */
function cached(key, raw, fb) { const m = memo.get(key); if (m && m.raw === raw) return m.v; const v = parse(raw, fb); memo.set(key, { raw, v }); return v; }
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);

}
let frameAt = 0, wokeAt = -1e9; // my loop's last frame, and when it last woke from a stall (a frozen or background tab)
/** Never while my own loop is stalled, nor for 0.7s after it wakes: the room moved on without me, so the newer state lands first. */
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() - frameAt < 1000 && performance.now() - wokeAt > 700;
const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId)); // in the preview you only watch

// ── TABLE ───────────────────────────────────────────────────────────────────────────
// Table units, y down like the screen: x and y run -HA..HA. Seat 0 is the bottom side, 1 the right,
// 2 the top, 3 the left. In a seat's LOCAL view its gate is along y = HA with its flippers just above
// it; each seat also owns the corner to its left (local -x), so the four corners are covered once.
const HA = CONFIG.table / 2, C = CONFIG.corner, PX = 150, PY = HA - 62; // PX, PY: where a seat's flippers are pinned
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TURN = [[1, 0], [0, 1], [-1, 0], [0, -1]]; // [cos, sin] of a quarter turn per seat
/** A point or direction from the table into seat `s`'s view, and back. */
function toLocal(s, x, y) { const [c, n] = TURN[s]; return [c * x - n * y, n * x + c * y]; }

/** Run `fn` on ball `b` as seat `s` sees it (position and speed turned), then turn it back. */
function inSeat(s, b, fn) {
  const [x, y] = toLocal(s, b.x, b.y), [vx, vy] = toLocal(s, b.vx, b.vy), l = { x, y, vx, vy };
  const r = fn(l);
  [b.x, b.y] = toWorld(s, l.x, l.y); [b.vx, b.vy] = toWorld(s, l.vx, l.vy);

}
const BUMPERS = [{ x: 0, y: 0, r: 40 }, { x: 0, y: 160, r: 24 }, { x: 160, y: 0, r: 24 }, { x: 0, y: -160, r: 24 }, { x: -160, y: 0, r: 24 }];

let tableCache = { key: "", t: null };
/** The walls for a set of open gates: [{ax, ay, bx, by, corner?}] in table units, plus the flipper pins and lane posts. */
function table(open) {
  const key = open.join();
  if (tableCache.key === key) return tableCache.t;
  const segs = [], pins = [], lanes = [], seg = (s, a, b, extra) => { const [ax, ay] = toWorld(s, ...a), [bx, by] = toWorld(s, ...b); segs.push({ ax, ay, bx, by, ...extra }); };
  for (let s = 0; s < 4; s++) {
    seg(s, [-HA, HA - C], [-HA + C, HA], { corner: s }); // this seat's left corner: a target
    if (open[s]) {

      pins.push(toWorld(s, -PX, PY), toWorld(s, PX, PY));

    const d = Math.SQRT1_2, cx = -LANE_D * d, cy = LANE_D * d; // the lane in front of this seat's corner, along the diagonal
    for (const side of [-1, 1]) seg(s, [cx + side * LANE_W * d - LANE_L * d, cy + side * LANE_W * d + LANE_L * d], [cx + side * LANE_W * d + LANE_L * d, cy + side * LANE_W * d - LANE_L * d], { post: true });
    lanes.push({ id: s, x: toWorld(s, cx, cy)[0], y: toWorld(s, cx, cy)[1], dx: toWorld(s, d, -d)[0], dy: toWorld(s, d, -d)[1] });

// ── PHYSICS ─────────────────────────────────────────────────────────────────────────
/** Bounce ball `b` off segment (a→b) of thickness `rad`. Returns true when it bounced. */
function hitSegment(b, ax, ay, bx, by, rad, bounce) {

/** A flipper in its seat's local view: side 0 = left, 1 = right; u = how far up (0..1), du = its swing speed (per second). */
function flipperLine(side, u) {
  const phi = CONFIG.flipperRest + (CONFIG.flipperUp - CONFIG.flipperRest) * u, th = side ? Math.PI - phi : phi, px = side ? PX : -PX;
  return { px, py: PY, th, tx: px + Math.cos(th) * CONFIG.flipperL, ty: PY + Math.sin(th) * CONFIG.flipperL };
}
/** Ball (in the seat's local view) against one flipper, moving or not: the flipper's swing adds to the bounce. */
function hitFlipper(l, side, u, du) {
  const f = flipperLine(side, u), ex = f.tx - f.px, ey = f.ty - f.py, L2 = ex * ex + ey * ey;
  const t = clamp(((l.x - f.px) * ex + (l.y - f.py) * ey) / L2, 0, 1), qx = f.px + ex * t, qy = f.py + ey * t;
  const dx = l.x - qx, dy = l.y - qy, d = Math.hypot(dx, dy), min = CONFIG.ballR + CONFIG.flipperR;
  if (d >= min || d < 1e-6) return false;

  const sx = -Math.sin(f.th) * rr * w, sy = Math.cos(f.th) * rr * w, rel = (l.vx - sx) * nx + (l.vy - sy) * ny; // the flipper's own speed where it touches

  l.vx -= (1 + CONFIG.flipBounce) * rel * nx; l.vy -= (1 + CONFIG.flipBounce) * rel * ny;
  return true;
}
/** Move ball `b` dt seconds. `flips` = [{seat, u: [left, right], du: [left, right]}] flippers that can hit it; `open[s]` = seat s has a gate.
 *  Returns { ev: [{e: "bumper"|"lane"|"corner"|"flip", i}], out: the seat it drained through, or -1 }. */
function stepBall(b, dt, flips, open) {

    for (const [px, py] of T.pins) hitSegment(b, px, py, px, py, 12, 0.6);

      const dx = b.x - q.x, dy = b.y - q.y, d = Math.hypot(dx, dy);

      const rx = b.x - L.x, ry = b.y - L.y, along = rx * L.dx + ry * L.dy, across = -rx * L.dy + ry * L.dx;

/** A ball waiting in the middle, then off toward a random open gate. */
function launchBall(b, open, at) {

/** Flippers swing toward held / let go. */
function swing(f, mask, dt) {

const flipState = [0, 1, 2, 3].map((seat) => ({ seat, u: [0, 0], du: [0, 0] })); // every seat's flippers as this screen moves them

// ── MATCH (HOST) ────────────────────────────────────────────────────────────────────
const host = { last: null, wasHost: false, bots: [null, null, null, null], lastBalls: 0, lastBody: "", pending: new Map(), nextK: 1, lastWrite: 0, add: [0, 0, 0, 0], lit: [0, 0, 0, 0] }; // add/lit: points and lights not written yet
let balls = []; // [{k, x, y, vx, vy, h, at, o}]: the host's real balls; everyone else's prediction of them
/** The game as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function game() {
  const g = cached("game", S.shared.game, null);
  return host.last && isHost() && (!g || host.last.v > g.v) ? host.last : g;
}
function writeGame(g) { g = { ...g, v: (game()?.v ?? 0) + 1 }; host.last = g; host.lastWrite = performance.now(); net.setShared("game", JSON.stringify(g)); return g; }
const openGates = (g) => g.lives.map((n) => n > 0);
/** A fresh match: one side per person (at least CONFIG.seats sides), bots on the spare open sides. */
function newGame(id) {
  const people = humans().slice(0, 4), n = clamp(Math.max(CONFIG.seats, people.length), 2, 4), order = [[0, 2], [0, 1, 2], [0, 1, 2, 3]][n - 2];
  const seats = ["", "", "", ""], free = [...order].sort(() => Math.random() - 0.5), t = Date.now();
  order.forEach((s) => { seats[s] = "bot"; });
  people.forEach((p, i) => { seats[free[i]] = p; });
  const startAt = t + CONFIG.countdownMs, lives = seats.map((id) => (id ? CONFIG.lives : 0));
  const g = { id, phase: "play", seats, lives, out: [], scores: [0, 0, 0, 0], lit: [0, 0, 0, 0], mb: 0, win: -1, startAt, nextBallAt: startAt + CONFIG.extraBallMs, overAt: 0 };
  balls = [];
  for (let i = 0; i < CONFIG.startBalls; i++) { const b = { k: host.nextK++, h: 0 }; launchBall(b, openGates(g), startAt + i * 900); balls.push(b); }

    const side = (s - view + 4) % 4, [x, y] = screenOf(s, 0, HA + 26), color = colorOf(g, s), mine = g.seats[s] === net.sessionId;
    const label = ATTRACT ? "" : `${mine ? "You" : nameOf(g, s)} · ${g.scores[s]}  `;
    const pips = "●".repeat(g.lives[s]) + "○".repeat(Math.max(0, CONFIG.lives - g.lives[s]));
    ctx.setTransform(DPR, 0, 0, DPR, DPR * (x + ox), DPR * (y + oy)); if (side % 2) ctx.rotate(-Math.PI / 2);
    ctx.font = `700 ${mine ? 14 : 12}px system-ui, sans-serif`;
    ctx.fillStyle = g.lives[s] > 0 ? color : "#6b5f99"; ctx.fillText(g.lives[s] > 0 ? label + pips : `${label}OUT`, 0, 0);
  }
}

// Sounds, made on the fly with WebAudio (no files).
let audio = null;
function unlockAudio() { if (!audio && !ATTRACT) try { audio = new AudioContext(); } catch {} }
function sfx(kind) {
  if (!audio) return;
  const t = audio.currentTime, o = audio.createOscillator(), gain = audio.createGain();
  const [type, f0, f1, len, vol] = { flip: ["square", 180, 90, 0.06, 0.1], bumper: ["triangle", 880, 1320, 0.08, 0.12], lane: ["sine", 600, 1500, 0.18, 0.12], corner: ["square", 520, 520, 0.1, 0.08],
    lose: ["sawtooth", 330, 70, 0.45, 0.14], out: ["sawtooth", 500, 40, 0.8, 0.15], beep: ["sine", 660, 660, 0.12, 0.15], go: ["sine", 990, 990, 0.25, 0.15], multi: ["triangle", 440, 1760, 0.5, 0.14] }[kind];
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + len);
  gain.gain.setValueAtTime(vol, t); gain.gain.exponentialRampToValueAtTime(0.001, t + len);
  o.connect(gain).connect(audio.destination); o.start(t); o.stop(t + len + 0.02);
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let board = null, boardFor = -1, seen = { lives: "", id: -1, count: -1, mb: -1 }, msgUntil = 0, dropped = false;
const startedAt = performance.now();
function nameOf(g, s) {
  const id = g.seats[s];
  if (id === net.sessionId) return myName;
  if (id === "bot") return BOT_NAMES[s];
  return String((S.entities.players[id] || {}).n || "Player").slice(0, 14);
}
function say(html, ms, now) { $("msg").innerHTML = html; msgUntil = now + ms; }
function hud(g, now) {
  const seat = g.seats.indexOf(net.sessionId), t = Date.now(), lives = g.lives.join();
  if (seen.id === g.id && lives !== seen.lives) { // a life lost: shown from the state, so everyone sees it
    const before = seen.lives.split(",").map(Number);
    g.lives.forEach((n, s) => {
      if (n >= before[s]) return;
      flash[s] = 1; shake = Math.max(shake, s === seat ? 16 : 7);
      const [x, y] = toWorld(s, 0, HA); sparks(x, y, "#ff3355", 26, 520, 0.7);
      if (s === seat) { say(n > 0 ? `<span style="color:#ff3355">DRAIN!</span><small>${n} li${n === 1 ? "fe" : "ves"} left</small>` : `<span style="color:#ff3355">OUT!</span>`, 1300, now); sfx(n > 0 ? "lose" : "out"); }
      else if (n === 0) { say(`<small style="color:${colorOf(g, s)}">${esc(nameOf(g, s))} is out!</small>`, 1300, now); sfx("lose"); }
    });
  }
  if (seen.id === g.id && g.mb > seen.mb) { say(`<span style="color:#ffd23f">MULTIBALL!</span>`, 1200, now); sfx("multi"); }
  if (seen.id !== g.id) msgUntil = 0;
  seen.lives = lives; seen.id = g.id; seen.mb = g.mb;
  const count = g.phase === "play" && t < g.startAt ? Math.ceil((g.startAt - t) / 1000) : 0;
  if (count !== seen.count) { if (count) { say(String(count), 900, now); sfx("beep"); } else if (seen.count > 0) { say("GO!", 600, now); sfx("go"); } seen.count = count; }
  $("msg").classList.toggle("on", now < msgUntil);
  if (ATTRACT) { $("top").textContent = $("hint").textContent = $("net").textContent = ""; return; }
  const alive = g.lives.filter((n) => n > 0).length;
  $("top").textContent = seat < 0 ? `Watching · ${alive} sides left · you're in the next match` : `You ${g.scores[seat]} pts · ${balls.length} ball${balls.length === 1 ? "" : "s"} · ${alive} sides left`;
  $("hint").textContent = seat < 0 ? "" : touchUI ? "Tap the left or right half to flip. Guard your gate at the bottom!" : "← and → (or A and D) flip your flippers, Space flips both. Guard your gate at the bottom!";
  $("hint").style.opacity = now - startedAt < 9000 ? 1 : 0;
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the balls" : ""}`;
  const card = g.phase === "over" && t > g.overAt - CONFIG.resultsMs + 1300;
  if (g.phase === "over" && !card && seen.over !== g.id && now >= msgUntil) { seen.over = g.id; say(g.win < 0 ? "DRAW" : g.win === seat ? `<span style="color:${myColor}">YOU WIN!</span>` : `<small style="color:${colorOf(g, g.win)}">${esc(nameOf(g, g.win))} wins!</small>`, 1300, now); }
  $("over").hidden = !card;
  if (card) {
    const won = seat >= 0 && g.win === seat;
    $("winner").textContent = won ? "You win!" : g.win < 0 ? "A draw" : `${nameOf(g, g.win)} wins!`;
    $("winner").style.color = g.win >= 0 ? colorOf(g, g.win) : "#fff";
    const ranking = [...(g.win >= 0 ? [g.win] : []), ...[...g.out].reverse()].filter((s) => g.seats[s]);
    $("ranking").innerHTML = ranking.map((s, i) => `<li class="${s === seat ? "me" : ""}">${esc(s === seat ? "You" : nameOf(g, s))}<span>${g.scores[s]} pts · ${i === 0 && g.win >= 0 ? "last one in" : "out"}</span></li>`).join("");
    $("again").hidden = seat < 0;
    $("again").textContent = myReady === g.id ? "Waiting for the others…" : "Play again";
    $("next").textContent = `Next match in ${Math.max(0, Math.ceil((g.overAt - t) / 1000))}s`;
    if (boardFor !== g.id) { boardFor = g.id; showBoard(seat >= 0 ? g.scores[seat] : 0); }
  }
}
function showBoard(score) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (score > 0 ? board.submit(score).catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No scores yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { const g = game(); if (g && g.phase === "over") { myReady = g.id; net.me.set("rdy", g.id); } };

/** Two players picked the same color at once (the joiner's first state can be empty), or a bot shows mine: the later sessionId picks again. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId), g = game();
  const botCols = g ? [0, 1, 2, 3].filter((s) => g.seats[s] === "bot").map((s) => botColor(g, s)) : [];
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId) && !botCols.includes(myColor)) return;
  const taken = new Set(others.map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || myColor; net.me.set("c", myColor);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
const keys = new Set(), pointers = new Map(); // pointerId -> side (1 left, 2 right)
const LEFT_KEYS = ["arrowleft", "a", "z", "shift"], RIGHT_KEYS = ["arrowright", "d", "m", "/"];
function readInput() {
  let m = 0;
  if (LEFT_KEYS.some((k) => keys.has(k)) || keys.has(" ")) m |= 1;
  if (RIGHT_KEYS.some((k) => keys.has(k)) || keys.has(" ")) m |= 2;
  for (const side of pointers.values()) m |= side;
  me.mask = m;
}
addEventListener("keydown", (e) => { const k = e.key.toLowerCase(); if ([...LEFT_KEYS, ...RIGHT_KEYS, " "].includes(k)) e.preventDefault(); unlockAudio(); keys.add(k); readInput(); });
addEventListener("keyup", (e) => { keys.delete(e.key.toLowerCase()); readInput(); });
addEventListener("blur", () => { keys.clear(); pointers.clear(); readInput(); });
cv.addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); cv.setPointerCapture(e.pointerId); pointers.set(e.pointerId, e.clientX < W / 2 ? 1 : 2); readInput(); });
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, (e) => { pointers.delete(e.pointerId); readInput(); });
document.addEventListener("touchmove", (e) => { if (!e.target.closest(".card")) e.preventDefault(); }, { passive: false });
addEventListener("contextmenu", (e) => e.preventDefault());

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const t0 = performance.now(); // not `now`: the first frame after a freeze can be stamped from before it ended
  if (frameAt && t0 - frameAt > 1000) { wokeAt = t0; host.wasHost = false; host.last = null; } // woke from a stall: drop my host copy, adopt state again (see isHost)
  frameAt = t0;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  const g0 = game();
  if (g0) for (let s = 0; s < 4; s++) swing(flipState[s], maskOf(g0, s), dt); // every flipper on this screen swings toward held / let go
  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const g = game();
  if (g) {
    lastGame = g;
    myTick(dt, g, now);
    draw(g, dt, now);
    if (now - lastHud > 100) { lastHud = now; hud(g, now); }
  }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("hit", (msg, from) => { if (isHost() && msg) applyHit(msg, from); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now(), fl: 0 });
  requestAnimationFrame(frame);
})();
</script>
